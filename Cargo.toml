[package]
name = "resolve2"
# The build's version (CHANGELOG.md): minor up per merged phase or step, patch up per fix.
version = "0.5.0"
edition = "2021"
description = "Resolve 2 - AI-guided product and project management on a local-first workspace"
license-file = "LICENSE"
publish = false

[[bin]]
name = "resolve2"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
egui_extras = { version = "0.29", default-features = false, features = ["datepicker"] }
image ={ version = "0.25", default-features = false, features = ["png"] }
rfd = { version = "0.15", default-features = false }
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
