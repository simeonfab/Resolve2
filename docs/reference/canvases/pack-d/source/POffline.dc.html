<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone not connected</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=DM+Serif+Display&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; position: relative; overflow: hidden; background: #1E1E1A; font-family: 'Inter', sans-serif; color: #F5F1E8; display: flex; flex-direction: column; padding: 70px 24px 120px; box-sizing: border-box; gap: 18px;">
<span style="width: 60px; height: 60px; border-radius: 18px; background: rgba(201,122,74,.16); display: flex; align-items: center; justify-content: center;"><svg width="28" height="28" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="color: #C97A4A;"><path d="M2 6.5a9 9 0 0 1 12 0M4.2 8.8a6 6 0 0 1 7.6 0M6.4 11.1a3 3 0 0 1 3.2 0M2.5 2.5l11 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span>
<h1 style="margin: 0; font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 32px; line-height: 1.15;">Can't reach your PC</h1>
<p style="margin: 0; font-size: 15.5px; line-height: 1.6; color: #B4AFA3;">Resolve keeps your work on your PC. The phone reads it over your home Wi-Fi. Last in touch today at 14:02.</p>
<div style="background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;">
<div style="font-size: 12px; font-weight: 700; letter-spacing: .04em; color: #8A8578;">CHECK THESE</div>
<sc-for list="{{checks}}" as="c" hint-placeholder-count="4"><div style="display: flex; gap: 10px; font-size: 15px; line-height: 1.45;"><span style="width: 6px; height: 6px; border-radius: 50%; background: #C8A040; margin-top: 8px; flex-shrink: 0;"></span><span>{{c}}</span></div></sc-for>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
<a href="#" style="height: 52px; display: flex; align-items: center; justify-content: center; background: #C8A040; color: #1A1A18; border-radius: 14px; font-size: 16px; font-weight: 600; text-decoration: none;">Try again</a>
<a href="#" style="height: 52px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,.2); color: #F5F1E8; border-radius: 14px; font-size: 16px; font-weight: 600; text-decoration: none;">Capture a task anyway</a>
<p style="margin: 2px 0 0; text-align: center; font-size: 13px; color: #8A8578;">Captures wait on this phone and send when your PC answers.</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"w":{"editor":"int","default":390},"h":{"editor":"int","default":844},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
w: this.props.w ?? 390, h: this.props.h ?? 844,
checks: ['Your PC is on and awake', 'The phone and PC are on the same Wi-Fi', 'Resolve 2 is open on the PC', 'Phone access is on: Settings, Sync and phone']
};
}
}
</script>
</body>
</html>
