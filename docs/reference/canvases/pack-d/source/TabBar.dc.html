<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bottom bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=DM+Serif+Display&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: {{w}}px; height: 150px; display: flex; flex-direction: column; justify-content: flex-end; font-family: 'Inter', sans-serif;">
<div style="padding: 0 14px 10px;">
<div style="height: 52px; border-radius: 999px; background: #1A1A18; display: flex; align-items: center; gap: 4px; padding: 0 5px 0 18px; box-shadow: 0 10px 28px rgba(26,26,24,.22);">
<a href="#" style="flex: 1; min-width: 0; height: 44px; display: flex; align-items: center; gap: 10px; text-decoration: none;"><span aria-hidden="true" style="color: #C8A040; font-size: 14px;">✦</span><span style="font-size: 14.5px; color: #F5F1E8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Ask Resolve, or capture a thought</span></a>
<button aria-label="Speak instead of typing" style="width: 42px; height: 42px; border-radius: 50%; border: 0; background: transparent; color: #B4AFA3; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="17" height="17" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="5.5" y="2" width="5" height="8" rx="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
<button aria-label="Add a task" style="width: 42px; height: 42px; border-radius: 50%; border: 0; background: #C8A040; color: #1A1A18; font: 500 22px 'Inter', sans-serif; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">+</button>
</div>
</div>
<nav aria-label="Main" style="background: #fff; border-top: 1px solid #DDD8CE; display: flex; padding: 6px 10px 28px;">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><a href="#" aria-label="{{t.l}}" style="flex: 1; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.lc}}; font-size: 11.5px; font-weight: {{t.fw}};"><svg width="22" height="22" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="color: {{t.ic}};"><path d="{{t.d}}" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>{{t.l}}</a></sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["tasks","calendar","search"],"default":"tasks"},"w":{"editor":"int","default":390},"$preview":{"width":390,"height":150}}'>
class Component extends DCLogic {
renderVals() {
const a = this.props.active ?? 'tasks';
const mk = (k, l, d) => { const on = k === a; return { l, d, ic: on ? '#C8A040' : '#9A9A92', lc: on ? '#1A1A18' : '#4A4A44', fw: on ? 600 : 500 }; };
return {
w: this.props.w ?? 390,
tabs: [
mk('tasks', 'Tasks', 'M2.5 4.5l1.2 1.2L6 3.5M8.5 4.5h5M2.5 10.5l1.2 1.2L6 9.5M8.5 10.5h5'),
mk('calendar', 'Calendar', 'M2.5 4h11v9.5h-11zM2.5 6.5h11M5.5 2.5v3M10.5 2.5v3'),
mk('search', 'Search', 'M7 2.5a4.5 4.5 0 1 0 0 9a4.5 4.5 0 1 0 0-9zM10.5 10.5l3 3')
]
};
}
}
</script>
</body>
</html>
