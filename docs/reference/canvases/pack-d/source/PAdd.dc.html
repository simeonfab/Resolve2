<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone quick add</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=DM+Serif+Display&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; position: relative; overflow: hidden; font-family: 'Inter', sans-serif; color: #1A1A18;">
<dc-import name="PTasks" w="{{w}}" h="{{h}}" hint-size="390px,844px"></dc-import>
<div style="position: absolute; inset: 0; background: rgba(26,26,24,.38);"></div>
<div role="dialog" aria-label="Add a task" style="position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 20px 20px 0 0; box-shadow: 0 -18px 60px rgba(26,26,24,.25); display: flex; flex-direction: column;">
<div style="padding: 10px 16px 14px; display: flex; flex-direction: column; gap: 12px;">
<span style="width: 40px; height: 4px; border-radius: 2px; background: #DDD8CE; align-self: center;"></span>
<div style="display: flex; align-items: center;"><h2 style="margin: 0; flex: 1; font-size: 17px; font-weight: 700;">Add a task</h2><button aria-label="Close" style="width: 44px; height: 44px; border: 0; background: none; font-size: 18px; color: #4A4A44;">✕</button></div>
<div style="display: flex; gap: 8px; align-items: center; border: 1.5px solid {{inBd}}; border-radius: 14px; padding: 6px 6px 6px 14px; min-height: 52px; box-sizing: border-box;">
<sc-if value="{{typed}}" hint-placeholder-val="{{ true }}"><span style="flex: 1; font-size: 16px; line-height: 1.5;">Pay rent <span style="background: #FBF5E6; border-radius: 4px; padding: 0 2px;">every month 9am</span> <span style="background: #F5E8E1; border-radius: 4px; padding: 0 2px;">p1</span> <span style="background: #E8EFE3; border-radius: 4px; padding: 0 2px;">#Home</span></span></sc-if>
<sc-if value="{{blank}}" hint-placeholder-val="{{ false }}"><span style="flex: 1; font-size: 16px; color: #4A4A44;">Call mum tomorrow 6pm p1 #Home</span></sc-if>
<button aria-label="Speak instead of typing" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #F2EDE4; color: #4A4A44; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="5.5" y="2" width="5" height="8" rx="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
</div>
<sc-if value="{{typed}}" hint-placeholder-val="{{ true }}">
<div><div style="font-size: 12px; font-weight: 700; color: #4A4A44; margin-bottom: 7px;">Resolve understood</div><div style="display: flex; gap: 6px; flex-wrap: wrap;"><span style="background: #FBF5E6; border: 1px solid #E9D9A8; border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 600;">↻ Every month · 9:00</span><span style="background: #F5E8E1; border: 1px solid #E2C3B3; color: #8B4A2A; border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 600;">Priority 1</span><span style="background: #E8EFE3; border: 1px solid #C5D3BC; color: #3F5A33; border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 600;">Project: Home</span></div></div>
</sc-if>
<sc-if value="{{blank}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: #4A4A44;">Write it how you'd say it. Dates, times, p1 to p4 and #Project are picked up as you type.</p></sc-if>
<sc-if value="{{showMsg}}" hint-placeholder-val="{{ false }}"><div role="status" style="border-radius: 10px; padding: 10px 12px; font-size: 13.5px; line-height: 1.45; background: {{msgBg}}; color: {{msgFg}};">{{msg}}</div></sc-if>
<button style="height: 50px; border: 0; border-radius: 12px; background: {{btnBg}}; color: {{btnFg}}; font: 600 16px 'Inter', sans-serif;">{{btn}}</button>
</div>
<div aria-hidden="true" style="height: {{kb}}px; background: #E4DED2; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #4A4A44;">Phone keyboard</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["full","empty","loading","error","offline"],"default":"full"},"w":{"editor":"int","default":390},"h":{"editor":"int","default":844},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.props.state ?? 'full';
const h = this.props.h ?? 844;
const M = {
loading: ['Saving…', '#F7F3EC', '#4A4A44'],
error: ["Your PC didn't accept it. The text is still here. Try once more.", '#F5E8E1', '#8B4A2A'],
offline: ["Your PC isn't reachable. Saved on this phone. It sends when they're back in touch.", '#F7F3EC', '#1A1A18']
};
const m = M[s];
return {
w: this.props.w ?? 390, h, kb: h < 800 ? 260 : 290,
typed: s !== 'empty', blank: s === 'empty', inBd: s === 'empty' ? '#DDD8CE' : '#C8A040',
showMsg: !!m, msg: m ? m[0] : '', msgBg: m ? m[1] : '#fff', msgFg: m ? m[2] : '#1A1A18',
btn: s === 'loading' ? 'Saving…' : s === 'error' ? 'Try again' : s === 'offline' ? 'Keep on this phone' : 'Add to Home',
btnBg: s === 'empty' ? '#E4DED2' : '#C8A040', btnFg: s === 'empty' ? '#4A4A44' : '#1A1A18'
};
}
}
</script>
</body>
</html>
