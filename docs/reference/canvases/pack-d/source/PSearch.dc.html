<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=DM+Serif+Display&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; position: relative; overflow: hidden; background: #F2EDE4; font-family: 'Inter', sans-serif; color: #1A1A18; display: flex; flex-direction: column;">
<header style="padding: 52px 18px 6px; display: flex; flex-direction: column; gap: 10px;">
<h1 style="margin: 0; font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 32px;">Search</h1>
<label style="display: flex; align-items: center; gap: 10px; height: 50px; border: 1.5px solid {{bd}}; border-radius: 14px; background: #fff; padding: 0 6px 0 14px; box-sizing: border-box;"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="color: #4A4A44;"><path d="M7 2.5a4.5 4.5 0 1 0 0 9a4.5 4.5 0 1 0 0-9zM10.5 10.5l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><input aria-label="Search everything" value="{{q}}" placeholder="Search everything" style="flex: 1; border: 0; outline: 0; font: 400 16px 'Inter', sans-serif; background: transparent; min-width: 0;"><button aria-label="Clear" style="width: 44px; height: 44px; border: 0; background: none; color: #4A4A44; font-size: 15px;">✕</button></label>
<div style="display: flex; gap: 6px; overflow: hidden;"><sc-for list="{{chips}}" as="c" hint-placeholder-count="5"><button aria-pressed="{{c.sel}}" style="height: 36px; padding: 0 13px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font: 600 13px 'Inter', sans-serif; white-space: nowrap; flex-shrink: 0;">{{c.t}}</button></sc-for></div>
</header>
<main style="flex: 1; min-height: 0; overflow: hidden; padding: 8px 18px 160px; display: flex; flex-direction: column; gap: 6px;">
<sc-if value="{{isFull}}" hint-placeholder-val="{{ true }}">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="font-size: 12.5px; font-weight: 700; color: #4A4A44; margin-top: 8px;">{{g.t}}</div>
<sc-for list="{{g.hits}}" as="x" hint-placeholder-count="2"><a href="#" style="display: block; min-height: 56px; background: #fff; border: 1px solid #DDD8CE; border-radius: 12px; padding: 10px 13px; text-decoration: none; color: #1A1A18; box-sizing: border-box;"><span style="display: block; font-size: 15px; line-height: 1.35;">{{x.t}}</span><span style="font-size: 12.5px; line-height: 1.4; color: #4A4A44;">{{x.s}}</span></a></sc-for>
</sc-for>
</sc-if>
<sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}"><div style="font-size: 12.5px; font-weight: 700; color: #4A4A44; margin-top: 8px;">Recent</div><sc-for list="{{recent}}" as="r" hint-placeholder-count="3"><a href="#" style="display: flex; align-items: center; gap: 10px; min-height: 48px; font-size: 15px; color: #1A1A18; text-decoration: none; border-bottom: 1px solid #DDD8CE;"><span aria-hidden="true" style="color: #4A4A44;">↺</span>{{r}}</a></sc-for></sc-if>
<sc-if value="{{isLoading}}" hint-placeholder-val="{{ false }}"><div role="status" aria-label="Searching" style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px;"><div style="height: 58px; border-radius: 12px; background: #fff; border: 1px solid #DDD8CE;"></div><div style="height: 58px; border-radius: 12px; background: #fff; border: 1px solid #DDD8CE;"></div><div style="height: 58px; border-radius: 12px; background: #fff; border: 1px solid #DDD8CE;"></div></div></sc-if>
<sc-if value="{{isNone}}" hint-placeholder-val="{{ false }}"><div style="margin-top: 50px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center;"><h2 style="margin: 0; font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 24px;">Nothing called "VAT return".</h2><p style="margin: 0; font-size: 15px; line-height: 1.55; color: #4A4A44;">Try fewer words, or add it now so it's there next time.</p><a href="#" style="margin-top: 6px; height: 48px; padding: 0 20px; display: flex; align-items: center; background: #C8A040; color: #1A1A18; border-radius: 12px; font-size: 15px; font-weight: 600; text-decoration: none;">Add "VAT return" as a task</a></div></sc-if>
<sc-if value="{{isError}}" hint-placeholder-val="{{ false }}"><div role="alert" style="margin-top: 30px; background: #fff; border: 1px solid #DDD8CE; border-radius: 16px; padding: 20px;"><div style="font-family: 'DM Serif Display', serif; font-size: 22px;">Search needs your PC.</div><p style="margin: 8px 0 0; font-size: 14.5px; line-height: 1.55; color: #4A4A44;">It runs on your PC, and your PC isn't answering. Tasks you already loaded are still in Tasks.</p><a href="#" style="margin-top: 16px; height: 48px; display: flex; align-items: center; justify-content: center; background: #1A1A18; color: #F5F1E8; border-radius: 12px; font-size: 15px; font-weight: 600; text-decoration: none;">Try again</a></div></sc-if>
</main>
<div style="position: absolute; left: 0; right: 0; bottom: 0;"><dc-import name="TabBar" active="search" w="{{w}}" hint-size="390px,150px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["full","empty","loading","none","error"],"default":"full"},"w":{"editor":"int","default":390},"h":{"editor":"int","default":844},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.props.state ?? 'full';
const ch = (t, on) => ({ t, sel: on ? 'true' : 'false', bg: on ? '#1A1A18' : '#fff', fg: on ? '#F5F1E8' : '#1A1A18', bd: on ? '#1A1A18' : '#DDD8CE' });
return {
w: this.props.w ?? 390, h: this.props.h ?? 844,
q: s === 'empty' ? '' : s === 'none' ? 'VAT return' : 'hours', bd: s === 'empty' ? '#DDD8CE' : '#C8A040',
chips: [ch('All', true), ch('Tasks'), ch('Events'), ch('Pages'), ch('Projects'), ch('Rows')],
isFull: s === 'full', isEmpty: s === 'empty', isLoading: s === 'loading', isNone: s === 'none', isError: s === 'error',
groups: [
{ t: 'Tasks · 2', hits: [{ t: 'Reconstruct 12 months of hours per café', s: 'Café flat-fee · Due today' }, { t: 'Model the flat fee against real hours', s: 'Café flat-fee · Next' }] },
{ t: 'Pages · 1', hits: [{ t: 'Plan', s: '…price it from real hours, not guesses.' }] },
{ t: 'Rows · 1', hits: [{ t: 'Hours log', s: 'Café clients database · 36 rows' }] }
],
recent: ['till export', 'Bean and Co.', 'invoices']
};
}
}
</script>
</body>
</html>
